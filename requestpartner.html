<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Partner - Royal Partner</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <div class="brand"><span>Royal</span>Partner</div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="requestpartner.html">Richiesta Partner</a>
          <a href="requestcollab.html">Richiesta Collaboratore</a>
          <a href="annunci.html">Annunci</a>
          <a href="comunicazioni.html">Comunicazioni</a>
        </nav>
      </div>
    </header>
    <main class="container">
      <section class="section">
        <div class="section-title"><h2>Request Partner</h2></div>
        <p class="section-description">
          Invia una richiesta partner al server ufficiale. Il modulo salva i dati reali sul backend e mostra le richieste già inviate.
        </p>
      </section>
      <section class="section">
        <button class="button" data-open-modal="partner-request-modal">Apri modulo Partner</button>
      </section>
      <section class="section">
        <div class="section-title"><h2>Richieste Partner inviate</h2></div>
        <div id="partner-requests-list"></div>
      </section>
      <section class="section">
        <div class="section-title"><h2>Log partner</h2></div>
        <div id="partner-logs-list"></div>
      </section>
    </main>
    <div id="partner-request-modal" class="modal-backdrop">
      <div class="modal">
        <button class="close-button modal-close" aria-label="Chiudi">×</button>
        <h3>Invia richiesta Partner</h3>
        <form id="partner-request-form" class="form-grid">
          <input name="name" class="input-field" type="text" placeholder="Nome partner / progetto" required />
          <input name="website" class="input-field" type="url" placeholder="Sito web (facoltativo)" />
          <input name="contactEmail" class="input-field" type="email" placeholder="Email di contatto" required />
          <textarea name="description" class="textarea-field" placeholder="Descrivi la tua partner" required></textarea>
          <button type="submit" class="button">Invia richiesta</button>
          <button type="button" class="secondary-button modal-close">Chiudi</button>
        </form>
      </div>
    </div>
    <script src="js/admin-pages.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        initPartnerRequestPage();
      });
    </script>
  </body>
</html>
